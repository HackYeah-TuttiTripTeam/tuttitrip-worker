name: Cleanup branch deployments

# A deleted branch's worker image is removed right away (and its container is
# switched to the develop/main fallback if the backend env still exists);
# every deploy also runs the same cleanup as a safety net.
on:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: [self-hosted, tuttitrip-worker-deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove worker images of deleted branches
        run: deploy/cleanup.sh
