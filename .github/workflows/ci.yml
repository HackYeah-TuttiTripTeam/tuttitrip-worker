name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Types (ty)
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Contract file is exported
        run: uv run python scripts/export_contracts.py --check

  contracts-check:
    # The worker is canonical, so drift is reported (warning + diff in the job
    # summary), not failed; the backend's own contracts-check fails instead.
    name: contracts-check
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 5
    env:
      # Fine-grained PAT (or GitHub App token) with Contents: read on
      # HackYeah-TuttiTripTeam/tuttitrip-backend. GITHUB_TOKEN cannot read
      # another private repository.
      GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare contracts/jobs.schema.json with the backend mirror
        run: deploy/check-contract.sh

  deploy:
    name: deploy
    needs: checks
    if: github.event_name == 'push'
    # Runner installed on the deploy host itself (dellpromaxgb10).
    runs-on: [self-hosted, tuttitrip-worker-deploy]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, (re)start the worker, smoke test, clean up
        run: deploy/deploy.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
