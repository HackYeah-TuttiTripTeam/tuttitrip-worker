name: CI

# One run per commit: every branch is built on push (the branch deployment
# needs the push event anyway), so there is no pull_request trigger.
#   lint, tests    parallel, on the org runners; a newer push to the same branch
#                  cancels them (never on main/develop).
#   contracts-check  8 s of curl + diff, so it runs on a GitHub-hosted runner
#                  instead of waiting in the queue for a hackathon runner.
#   deploy         main/develop wait for lint + tests; any other branch deploys
#                  its preview at once (it does not wait for the queue). Deploys
#                  are never cancelled mid-way, they run one after another per branch.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# uv keeps its package cache in ~/.cache/uv, which stays on the self-hosted
# runners between runs, so the GitHub cache upload/download step is off.

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 10
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Types (ty)
        run: uv run ty check
      - name: Contract file is exported
        run: uv run python scripts/export_contracts.py --check

  tests:
    name: tests
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Tests (including architecture tests)
        run: uv run pytest

  contracts-check:
    # The worker is canonical, so drift is reported (warning + diff in the job
    # summary), not failed; the backend's own contracts-check fails instead.
    name: contracts-check
    # GitHub-hosted: this repository is private, so the run draws on the org's
    # included minutes (about one billed minute per push).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-contracts-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    env:
      # Fine-grained PAT (or GitHub App token) with Contents: read on
      # HackYeah-TuttiTripTeam/tuttitrip-backend. GITHUB_TOKEN cannot read
      # another private repository.
      GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare contracts/jobs.schema.json with the backend mirror
        run: deploy/check-contract.sh

  # Branch previews: no `needs`, so the deployment is not held back by the queue.
  deploy-preview:
    name: deploy
    if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main'
    # Runner installed on the deploy host itself (dellpromaxgb10).
    runs-on: [self-hosted, tuttitrip-worker-deploy]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env: &deploy-env
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps: &deploy-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, (re)start the worker, smoke test, clean up
        run: deploy/deploy.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  # main and develop only go out after lint and tests are green.
  deploy:
    name: deploy
    needs: [lint, tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tuttitrip-worker-deploy]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env: *deploy-env
    steps: *deploy-steps
