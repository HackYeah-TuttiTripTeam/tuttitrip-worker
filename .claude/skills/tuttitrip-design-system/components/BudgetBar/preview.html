<!doctype html>
<html lang="pl">
<head><link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>BudgetBar</title>
<style>html,body{margin:0;} body{padding:16px;}</style></head>
<body class="tt">
<section class="tt-sheet" style="max-width:460px">
 <div class="tt-between"><p class="tt-label">Budżet dnia 2</p><p class="tt-fig" style="margin:0;font-size:20px">620 zł <span class="tt-muted" style="font-size:15px;font-weight:500">z 500–700</span></p></div>
 <div class="tt-budget" style="margin:14px 0 6px">
  <div class="tt-budget__track"></div>
  <div class="tt-budget__comfort" style="left:65%;width:26%"></div>
  <div class="tt-budget__margin" style="left:91%;width:9%"></div>
  <div class="tt-budget__fill" style="width:80.5%"></div>
  <span class="tt-budget__limit tt-goal" style="left:91%"></span>
 </div>
 <div class="tt-axis__ticks" style="margin:0"><span>0</span><span>komfort od 500</span><span>limit 700</span></div>
 <p class="tt-meta" style="margin-top:8px;color:var(--foreground)">Zostało <span class="tt-fig">80 zł</span> do limitu.</p>
</section>
</body>
</html>
