<!doctype html>
<html lang="pl">
<head><link rel="stylesheet" href="../../theme.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>RatingControl</title>
<style>html,body{margin:0;} body{padding:16px;}</style></head>
<body class="tt">
<div class="tt-stack" style="max-width:380px">
 <p class="tt-h3">Muzeum Bursztynu</p>
 <div class="tt-rating" role="group" aria-label="Twoja ocena">
  <button class="is-want" aria-pressed="false"><svg class="tt-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10L8 10L9.6213 3.5149C9.8439 2.6246 10.6438 2 11.5616 2L13.2344 2C14.2431 2 15.0939 2.7511 15.219 3.7519L16 10L20 10C21.1046 10 22 10.8954 22 12C22 12.2398 21.9569 12.4777 21.8727 12.7022L18.8727 20.7022C18.5799 21.4829 17.8337 22 17 22L4 22C2.8954 22 2 21.1046 2 20L2 12C2 10.8954 2.8954 10 4 10ZM8 10L8 22" fill="none"></path></svg>Chcę</button>
  <button class="is-neutral" aria-pressed="false"><svg class="tt-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19"></path></svg>Obojętnie</button>
  <button class="is-decline" aria-pressed="true"><svg class="tt-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14L16 14L14.3787 20.4851C14.1561 21.3754 13.3562 22 12.4384 22L10.7656 22C9.7569 22 8.9061 21.2489 8.781 20.2481L8 14L4 14C2.8954 14 2 13.1046 2 12C2 11.7602 2.0431 11.5223 2.1273 11.2978L5.1273 3.2978C5.4201 2.5171 6.1663 2 7 2L20 2C21.1046 2 22 2.8954 22 4L22 12C22 13.1046 21.1046 14 20 14ZM16 14L16 2" fill="none"></path></svg>Nie chcę</button>
 </div>
 <p class="tt-label">Dlaczego nie?</p>
 <div class="tt-row">
  <button class="tt-chip" aria-pressed="false">Za drogo</button><button class="tt-chip" aria-pressed="false">Za daleko</button><button class="tt-chip" aria-pressed="true"><svg class="tt-icon tt-icon--sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12L9.66667 17L19 7"></path></svg>Za duży tłum</button>
  <button class="tt-chip" aria-pressed="false">Nie mój klimat</button><button class="tt-chip" aria-pressed="false">Za trudne dla dziecka</button><button class="tt-chip" aria-pressed="false">Inne</button>
 </div>
</div>
</body>
</html>
